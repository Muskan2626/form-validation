<html>
    <head>
        <title>
            form Validation
        </title>
        <script src="https://code.jquery.com/jquery-3.6.3.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js"></script>
        <style>
.parent-div {
  border-radius: 5px;
  background-color: #f2f2f2;
  padding: 20px;
  width:900px;
  margin: auto;
}
.heading{
    text-align: center;
    font-size: 40px;
}

.child-div{
    width: 78%;
    margin: auto;
}
label{
    font-size : 30px ;
}

.text {
  width: 100%;
  padding: 12px 20px;
  margin: 8px 0;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-size: 23px;
}

.submit{
  width: 100%;
  background-color: #3844ee;
  color: white;
  padding: 14px 20px;
  margin: 8px 0;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 30px
}

 .error{
    color:red; 
    padding-left: 20px;
    font-size: 22px;
    }
        </style>
    </head>
    <body>
 <div class="parent-div">
    
    <div class="child-div">
            <h1 class="heading">Form Validation</h1>
        <form name="form" id="form" autocomplete="off" method="get" style="font-size:24px">
          <label>User Name :</label>
          <input type="text" name="uname" placeholder="User Name" class="text">
          <br>
          <br>
          <label>Email :</label>
          <input type="email" name="email" placeholder="Email" class="text">
          <br>
          <br>
          <label>Password :</label>
          <input type="password" name="password" placeholder="Password" class="text">
          <br>
          <br>
          <label>Mobile no. :</label>
          <input type="text" name="mobile" placeholder="mobile number" class="text">
          <br>
          <br>
          <label for="birthday">Date Of Birth :</label>
         <input type="date" class="text" name="dob" name="birthday">
         <br>
         <br>
         <label>Gender :</label>
         <input type="radio" name="gender" value="male">
         <label for="male">Male</label>
        <input type="radio" name="gender" value="female">
         <label for="female">Female</label>
        <input type="radio" name="gender" value="others">
        <label for="others">Others</label>
      

         <br>
         <br>
         <label>Address :</label>
         <textarea rows="1" cols="70" placeholder="full address" class="text" name="address"></textarea>
         <br>
         <br>
       <label> Languages :</label>
        <br>
        <br>
        <label>JavaScript</label>
        <input type="checkbox" name="checkbox">
        <br>
        <label>Python</label>
        <input type="checkbox" name="checkbox">
        <br>
        <label>C++</label>
        <input type="checkbox" name="checkbox">
        <br>
        <label>Java</label>
        <input type="checkbox" name="checkbox">
        <br>
        <label>Android</label>
        <input type="checkbox" name="checkbox">
        <br>
        <br>
        <label style="font-style:italic">Please agree to our policy</label>
        <input type="checkbox" name="policy">
    <br>
    <br>
          <input type="submit" value="Submit" class="submit">
        </form>
     </div>
 </div>


        <script>
        $("#form").validate({
 rules:{
                uname:{
                    required:true,
                    minlength:4,
                    maxlength:14,
                },
              email:{
                required:true,
                email:true,
             },
             password:{
                    required:true,
                    // minlength:8,
                    // maxlength:16,
                    password:true
                },
            mobile:{
                required:true,
                number:true,
                minlength:10,
                maxlength:10,
            },
            address:{
                required:true,
                minlength:30,
            },
            checkbox:{
                required:true,
                minlength:3,
            },
            dob:{
                required:true,
            },
            gender:{
                required:true,
            },
            policy:{
                required:true
            }
            },

messages:{
                uname:{
                    required:"please Enter User Name",
                    minlength:"Name should contain atleast 4 letter",
                    maxlength:"Name should not exeed 14 letter",
                 },
                email:{
                required:"please Enter Email",
                email:"please Enter Valid Email",
             },
             password:{
                    required:"please Enter Password",
                    // minlength:"Password should contain atleast 8 character",
                    // maxlength:"Password should not exeed 16 character",
                    password:"please Enter Valid Password"
                }, 
            mobile:{
                required:"please enter mobile number",
                number:"please enter valid number",
                minlength:"please enter valid number",
                maxlength:"please enter valid number",
            },
            address:{
                required:"please enter your address",
                minlength:"please enter valid address",
            },
                checkbox:{
                required:"please select",
                minlength:"please select at least 3"
            },
            dob:{
                required:"plese enter Date Of Birth",
            },
            gender:{
                required:"please select your gender"
            },
            policy:{
                required:"please accept our policy"
            }

            }
        })
        </script>

    </body>
</html>
